<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://*.peerjs.com wss://*.peerjs.com">
  <title>Baderna</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="lobby" class="card">
    <h1>Baderna</h1>
    <label>Seu nome
      <input id="name" maxlength="24" placeholder="ex: Jeff">
    </label>
    <label>Código da sala
      <div class="row">
        <input id="room" maxlength="32" placeholder="ex: k7f2-p9qx">
        <button id="gen" type="button" title="Gerar código aleatório">🎲</button>
      </div>
    </label>
    <label>Microfone
      <select id="mic"></select>
      <div class="meter" title="Fale pra testar"><div id="mic-level"></div></div>
    </label>
    <label>Saída de som
      <select id="speaker"></select>
    </label>
    <button id="join" class="primary">Entrar</button>
    <p id="lobby-status" class="status"></p>
  </section>

  <section id="room-view" hidden>
    <header>
      <div>
        <strong id="room-title"></strong>
        <span id="role" class="badge"></span>
      </div>
      <div class="controls">
        <button id="share">🖥️ Compartilhar tela</button>
        <button id="mute">🎤 Mutar</button>
        <button id="leave" class="danger">Sair</button>
      </div>
    </header>
    <div id="stage" hidden></div>
    <ul id="members"></ul>
    <p id="room-status" class="status"></p>
  </section>

  <dialog id="share-dialog">
    <h2>Compartilhar tela</h2>
    <div class="row">
      <label>Qualidade
        <select id="share-quality">
          <option value="720p30">720p 30fps</option>
          <option value="1080p30" selected>1080p 30fps</option>
          <option value="1080p60">1080p 60fps</option>
          <option value="1440p60">1440p 60fps</option>
        </select>
      </label>
      <label>Conteúdo
        <select id="share-mode">
          <option value="motion">Filme / vídeo (prioriza fluidez)</option>
          <option value="detail">Texto / código (prioriza nitidez)</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label>Seu upload (Mbps) — o app divide entre quem assiste
        <input id="share-upload" type="number" min="0" step="1" placeholder="sem limite">
      </label>
    </div>
    <p id="share-estimate" class="status estimate"></p>
    <label class="check">
      <input type="checkbox" id="share-audio" checked>
      Transmitir áudio — janela: só o som dela · tela inteira: tudo menos a Baderna
    </label>
    <div id="sources" class="sources"></div>
    <div class="dialog-actions">
      <button id="share-cancel" type="button">Cancelar</button>
    </div>
  </dialog>

  <script src="../node_modules/peerjs/dist/peerjs.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
